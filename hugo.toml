baseURL = 'https://d0nghyun.github.io/'
languageCode = 'en-us'
title = 'Donghyun Lee'
theme = 'PaperMod'
enableRobotsTXT = true
hasCJKLanguage = true
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[languages]

  [languages.en]
  languageName = 'English'
  languageCode = 'en-us'
  weight = 1

  [languages.ko]
  languageName = '한국어'
  languageCode = 'ko'
  weight = 2

[pagination]
pagerSize = 10

[outputs]
home = ['HTML', 'RSS', 'JSON']

[params]
env = 'production'
defaultTheme = 'auto'
ShowReadingTime = true
ShowPostNavLinks = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true
ShowToc = true

  [params.homeInfoParams]
  Title = 'Donghyun Lee'
  Content = 'Writing about agent engineering, quant research, and how I run my work on axioms. 한국어/English.'

  [[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/d0nghyun'

  [[params.socialIcons]]
  name = 'linkedin'
  url = 'https://www.linkedin.com/in/movinghyun/'

  [[params.socialIcons]]
  name = 'rss'
  url = '/index.xml'

[menu]

  [[menu.main]]
  identifier = 'archives'
  name = 'Archive'
  url = '/archives/'
  weight = 10

  [[menu.main]]
  identifier = 'categories'
  name = 'Categories'
  url = '/categories/'
  weight = 15

  [[menu.main]]
  identifier = 'tags'
  name = 'Tags'
  url = '/tags/'
  weight = 20

  [[menu.main]]
  identifier = 'about'
  name = 'About'
  url = '/about/'
  weight = 30

  [[menu.main]]
  identifier = 'search'
  name = 'Search'
  url = '/search/'
  weight = 40

[markup]

  [markup.highlight]
  noClasses = false
  codeFences = true
  guessSyntax = true
